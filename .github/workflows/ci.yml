name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# You can leverage Vercel Remote Caching with Turbo to speed up your builds
# @link https://turborepo.com/docs/core-concepts/remote-caching#remote-caching-on-vercel-builds
env:
  FORCE_COLOR: 3
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # `turbo --affected` diffs against the PR base / previous push;
          # a shallow clone would mark every package as changed.
          fetch-depth: 0

      - name: Setup
        uses: ./tooling/github/setup

      - name: Copy env
        shell: bash
        run: cp .env.example .env

      # Repo-wide and fast, so not worth scoping to affected packages.
      - name: Lint + format (Biome)
        run: bun check

      - name: Workspace consistency (sherif)
        run: bun lint:ws

      - name: Unused files, exports and deps (knip)
        run: bun lint:deps

      # Offline: snapshots/journal consistency, then fail if src/schema has
      # changes that were never turned into a migration with `bun db:generate`.
      - name: Migrations (drizzle-kit)
        shell: bash
        timeout-minutes: 5
        run: |
          bun db:check
          bun db:generate
          if [ -n "$(git status --porcelain packages/db/migrations)" ]; then
            echo "::error::Schema changes without a migration. Run \`bun db:generate\` and commit packages/db/migrations."
            git status --porcelain packages/db/migrations
            exit 1
          fi

      - name: Build, typecheck, test (affected)
        run: bun turbo run build typecheck test --affected

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: acme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Copy env
        shell: bash
        run: |
          cp .env.example .env
          # `next start` runs in production mode, where Better Auth refuses
          # the default secret. Throwaway value, scoped to this job.
          sed -i "s|^AUTH_SECRET=.*|AUTH_SECRET=$(openssl rand -base64 32)|" .env

      # Same path as production: versioned SQL from packages/db/migrations.
      - name: Migrate DB
        run: bun db:migrate

      - name: Build app
        run: bun turbo run build -F @acme/app

      - name: Install Playwright browser
        working-directory: apps/app
        run: bunx playwright install --with-deps chromium

      - name: E2E tests
        run: bun turbo run e2e -F @acme/app

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/app/playwright-report
          retention-days: 7
